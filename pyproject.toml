[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-boundary-prober"
version = "0.1.0"
description = "Local configuration and policy foundation for agent sandbox audits"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
abp = "agent_boundary_prober.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
